name: tienda-don-julio

services:
  db:
    image: postgres:16-alpine
    container_name: tiendabarrio_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tiendabarrio}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tiendabarrio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Api/Dockerfile
    container_name: tiendabarrio_api
    ports:
      - "5222:8080"
    environment:
      # Development para que Swagger esté disponible en http://localhost:5222/swagger
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-tiendabarrio};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Key: ${JWT_KEY:-clave-solo-para-desarrollo-local-cambiar-en-produccion-0123456789}
      Jwt__Issuer: TiendaDonJulio.Api
      Jwt__Audience: TiendaDonJulio.Clients
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: